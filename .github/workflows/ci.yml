name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: v2.13.2
  GORELEASER_VERSION: "~> v2"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Trace toolchain
        run: go version

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -v ./...

      # ui/static/app.js ships without a build step. The runner image's Node
      # catches syntax errors before the file reaches a browser.
      - name: Check dashboard script syntax
        run: node --check ui/static/app.js

  # The release's Android build needs cgo and the Android NDK, which no
  # other job exercises. This runs the same GoReleaser build on every push,
  # so a break shows up here instead of on release day.
  android:
    name: Android build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Find the Android NDK compiler
        run: |
          cc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$cc" || { echo "no Android NDK clang at $cc"; exit 1; }
          echo "ANDROID_CC=$cc" >> "$GITHUB_ENV"

      - name: Build for Android with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean --id android

      - name: Check that the binary uses cgo
        run: |
          file dist/android_android_arm64*/dnsbench
          go version -m dist/android_android_arm64*/dnsbench | grep -q 'CGO_ENABLED=1'

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # Installed from the released binary rather than built with `go install`,
      # which needs a Go toolchain at least as new as the linter itself. The
      # pinned version must still be built with a Go no older than this module's
      # go directive, or golangci-lint refuses to load the config.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
